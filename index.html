<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Book</title>
    <!-- CSS -->
    <link rel="stylesheet" href="./style.css">
    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- DAISYUI -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5" type="text/css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- SCRIPT -->
    <script src="./script.js" defer></script>
</head>
<body>
    <main>
        <!-- TOP CONTAINER -->
        <div class="fixed top-0 left-0 w-full h-auto p-4 flex flex-row justify-end items-center">
            <!-- Toggle mode button -->
            <label class="swap swap-rotate">
                <input type="checkbox" class="theme-controller" value="black" />
                <i class="bi bi-sun-fill swap-on"></i>
                <i class="bi bi-moon-stars-fill swap-off"></i>
            </label>
        </div>

        <!-- FLIP BOOK TRIGGERS -->
        <input type="checkbox" id="cover_checkbox">
        <input type="checkbox" id="page1_checkbox">
        <input type="checkbox" id="page2_checkbox">
        <input type="checkbox" id="page3_checkbox">
        <input type="checkbox" id="page4_checkbox">
        <input type="checkbox" id="page5_checkbox">
        <input type="checkbox" id="page6_checkbox">
        <input type="checkbox" id="page7_checkbox">
        <input type="checkbox" id="page8_checkbox">

        <div id="flip_book">
            <!-- Front Cover (Page 1) -->
            <div class="front_cover">
                <label for="cover_checkbox" id="cover"></label>
                <img class="front_content" src="./assets/images/pages/page_01.png" alt="Front Cover">
            </div>

            <!-- Page 1 (Leaf 1: Pages 2 & 3) -->
            <div class="page" id="page1">
                <div class="front_page">
                    <label for="page1_checkbox"></label>
                    <img class="edge_shading" src="./assets/images/front_page_edge_shading.webp" alt="Front page edge shading">
                    <img class="front_content" src="./assets/images/pages/page_02.png" alt="Page 2">
                </div>
                <div class="back_page">
                    <label for="page1_checkbox"></label>
                    <img class="edge_shading" src="./assets/images/back_page_edge_shading.webp" alt="Back page edge shading">
                    <img class="back_content" src="./assets/images/pages/page_03.png" alt="Page 3">
                </div>
            </div>

            <!-- Page 2 (Leaf 2: Pages 4 & 5) -->
            <div class="page" id="page2">
                <div class="front_page">
                    <label for="page2_checkbox"></label>
                    <img class="edge_shading" src="./assets/images/front_page_edge_shading.webp" alt="Front page edge shading">
                    <img class="front_content" src="./assets/images/pages/page_04.png" alt="Page 4">
                </div>
                <div class="back_page">
                    <label for="page2_checkbox"></label>
                    <img class="edge_shading" src="./assets/images/back_page_edge_shading.webp" alt="Back page edge shading">
                    <img class="back_content" src="./assets/images/pages/page_05.png" alt="Page 5">
                </div>
            </div>

            <!-- Page 3 (Leaf 3: Pages 6 & 7) -->
            <div class="page" id="page3">
                <div class="front_page">
                    <label for="page3_checkbox"></label>
                    <img class="edge_shading" src="./assets/images/front_page_edge_shading.webp" alt="Front page edge shading">
                    <img class="front_content" src="./assets/images/pages/page_06.png" alt="Page 6">
                </div>
                <div class="back_page">
                    <label for="page3_checkbox"></label>
                    <img class="edge_shading" src="./assets/images/back_page_edge_shading.webp" alt="Back page edge shading">
                    <img class="back_content" src="./assets/images/pages/page_07.png" alt="Page 7">
                </div>
            </div>

            <!-- Page 4 (Leaf 4: Pages 8 & 9) -->
            <div class="page" id="page4">
                <div class="front_page">
                    <label for="page4_checkbox"></label>
                    <img class="edge_shading" src="./assets/images/front_page_edge_shading.webp" alt="Front page edge shading">
                    <img class="front_content" src="./assets/images/pages/page_08.png" alt="Page 8">
                </div>
                <div class="back_page">
                    <label for="page4_checkbox"></label>
                    <img class="edge_shading" src="./assets/images/back_page_edge_shading.webp" alt="Back page edge shading">
                    <img class="back_content" src="./assets/images/pages/page_09.png" alt="Page 9">
                </div>
            </div>

            <!-- Page 5 (Leaf 5: Pages 10 & 11) -->
            <div class="page" id="page5">
                <div class="front_page">
                    <label for="page5_checkbox"></label>
                    <img class="edge_shading" src="./assets/images/front_page_edge_shading.webp" alt="Front page edge shading">
                    <img class="front_content" src="./assets/images/pages/page_10.png" alt="Page 10">
                </div>
                <div class="back_page">
                    <label for="page5_checkbox"></label>
                    <img class="edge_shading" src="./assets/images/back_page_edge_shading.webp" alt="Back page edge shading">
                    <img class="back_content" src="./assets/images/pages/page_11.png" alt="Page 11">
                </div>
            </div>

            <!-- Page 6 (Leaf 6: Pages 12 & 13) -->
            <div class="page" id="page6">
                <div class="front_page">
                    <label for="page6_checkbox"></label>
                    <img class="edge_shading" src="./assets/images/front_page_edge_shading.webp" alt="Front page edge shading">
                    <img class="front_content" src="./assets/images/pages/page_12.png" alt="Page 12">
                </div>
                <div class="back_page">
                    <label for="page6_checkbox"></label>
                    <img class="edge_shading" src="./assets/images/back_page_edge_shading.webp" alt="Back page edge shading">
                    <img class="back_content" src="./assets/images/pages/page_13.png" alt="Page 13">
                </div>
            </div>

            <!-- Page 7 (Leaf 7: Pages 14 & 15) -->
            <div class="page" id="page7">
                <div class="front_page">
                    <label for="page7_checkbox"></label>
                    <img class="edge_shading" src="./assets/images/front_page_edge_shading.webp" alt="Front page edge shading">
                    <img class="front_content" src="./assets/images/pages/page_14.png" alt="Page 14">
                </div>
                <div class="back_page">
                    <label for="page7_checkbox"></label>
                    <img class="edge_shading" src="./assets/images/back_page_edge_shading.webp" alt="Back page edge shading">
                    <img class="back_content" src="./assets/images/pages/page_15.png" alt="Page 15">
                </div>
            </div>

            <!-- Back Cover (Page 16) -->
            <div class="back_cover">
                <img class="back_content" src="./assets/images/pages/page_16.png" alt="Back Cover">
            </div>
        </div>

        <!-- BOTTOM CONTAINER -->
        <div class="fixed left-0 bottom-0 w-full h-auto p-4 flex flex-row justify-between items-center">
            <!-- GITHUB LINK -->
            <a class="tooltip tooltip-right" data-tip="Click to visit the GitHub repository." href="https://github.com/fchavonet/creative_coding-flip_book" target="_blank">
                <img src="https://img.shields.io/github/stars/fchavonet/creative_coding-flip_book?style=social&label=GitHub%20Stars" alt="GitHub Stars">
            </a>
            <!-- PORTFOLIO LINK -->
            <a class="link link-hover text-xs" href="https://www.fchavonet.dev" target="_blank">
                www.fchavonet.dev
            </a>
        </div>

        <!-- RESPONSIVE WARNING -->
        <dialog id="responsive-warning" class="modal backdrop-blur-xl">
            <div class="modal-box max-w-xs flex flex-col justify-center items-center gap-4 text-center rounded-xl bg-base-300">
                <i class="bi bi-aspect-ratio text-4xl"></i>
                <p class="text-lg font-semibold -mt-2">
                    This web application is designed for larger screens.
                </p>
                <p class="text-xs">
                    A mobile-friendly version is coming soon...
                </p>
            </div>
        </dialog>
    </main>
</body>
</html>
